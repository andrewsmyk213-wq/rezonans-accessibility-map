<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Резонанс — карта доступності Чернівців на основі відкритих даних. Шукайте місця, перевіряйте характеристики та повідомляйте про бар'єри.">
  <title>Резонанс — Доступні Чернівці</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<a class="skip" href="#panel">Перейти до змісту</a>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" aria-label="Резонанс — Доступні Чернівці">
      <div class="brand-icon"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M8 26a12 12 0 0 1 24 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M13 27a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="27" r="3" fill="currentColor"/><path d="M8 13h4M28 13h4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="brand-copy"><strong>резонанс<span class="brand-dot">.</span></strong><span>Доступні Чернівці</span></div>
    </div>
    <div class="header-actions">
      <button class="quiet-button info-button" id="dataButton" type="button" aria-label="Стан і джерела даних"><span class="live-indicator"></span><span id="dataHeader">Відкриті дані</span></button>
      <button class="round-button" id="openSettings" type="button" aria-label="Налаштування інтерфейсу"><svg class="ico"><use href="#i-sliders"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <section class="map-area" aria-label="Інтерактивна карта Чернівців">
      <div id="map" class="map"></div>
      <div class="map-fallback" id="mapFallback" role="status"><svg class="ico xl"><use href="#i-map"/></svg><strong>Карту не вдалося завантажити</strong><span>Перевірте інтернет. Список місць залишається доступним.</span></div>
      <div class="map-fog" aria-hidden="true"></div>
      <div class="map-floating-top">
        <div class="search-wrap">
          <svg class="ico"><use href="#i-search"/></svg>
          <label class="sr-only" for="search">Пошук за назвою або адресою</label>
          <input id="search" type="search" placeholder="Куди вам потрібно?" autocomplete="off">
          <button id="clearSearch" class="clear-search hidden" aria-label="Очистити пошук" type="button">×</button>
          <button id="openNeeds" class="search-settings" title="Мої потреби" aria-label="Мої потреби" type="button"><svg class="ico"><use href="#i-sliders"/></svg></button>
        </div>
        <div id="categories" class="categories" role="group" aria-label="Типи місць"></div>
      </div>
      <div class="map-controls">
        <button id="locateButton" class="map-control" type="button" title="Моє місце" aria-label="Моє місце"><svg class="ico"><use href="#i-locate"/></svg></button>
        <button id="zoomPlus" class="map-control" type="button" title="Збільшити" aria-label="Збільшити карту"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button id="zoomMinus" class="map-control" type="button" title="Зменшити" aria-label="Зменшити карту"><svg class="ico"><use href="#i-minus"/></svg></button>
      </div>
      <div class="map-bottom-tip" id="mapInfo"><span class="tip-mark"></span> Дані про доступність можуть бути неповними</div>
    </section>

    <aside class="panel" id="panel" tabindex="-1" aria-label="Інформація про місця">
      <div class="panel-handle" aria-hidden="true"></div>
      <div class="panel-top">
        <div class="panel-heading"><div><p class="eyebrow">ВАШЕ МІСТО, БЕЗ ЗАЙВИХ ПЕРЕШКОД</p><h1 id="panelTitle">Знайдіть потрібне місце</h1></div><button id="backButton" class="round-button hidden" type="button" aria-label="Назад"><svg class="ico"><use href="#i-arrow-left"/></svg></button></div>
        <p id="panelSubtitle" class="panel-subtitle">Оберіть заклад на карті або скористайтеся пошуком.</p>
      </div>
      <div class="panel-body" id="panelBody" aria-live="polite"></div>
    </aside>
  </main>

  <nav class="bottom-nav" aria-label="Основна навігація">
    <button type="button" data-tab="map" class="nav-btn active" aria-current="page"><svg class="ico"><use href="#i-map"/></svg><span>Карта</span></button>
    <button type="button" data-tab="list" class="nav-btn"><svg class="ico"><use href="#i-list"/></svg><span>Список</span></button>
    <button type="button" data-tab="saved" class="nav-btn"><svg class="ico"><use href="#i-heart"/></svg><span>Збережене</span></button>
  </nav>
</div>

<div class="overlay hidden" id="overlay" aria-hidden="true">
  <div class="overlay-shade" id="overlayShade"></div>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle">Налаштування</h2><button id="closeModal" type="button" class="round-button" aria-label="Закрити"><svg class="ico"><use href="#i-x"/></svg></button></div>
    <div id="modalContent" class="modal-content"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg xmlns="http://www.w3.org/2000/svg" class="svg-defs" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 5 5"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16M15 5v16"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20 5.5a5 5 0 0 0-7.1 0L12 6.4l-.9-.9A5 5 0 0 0 4 12.6l8 8 8-8a5 5 0 0 0 0-7.1z"/></symbol>
<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m13 5-7 7 7 7M6 12h15"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s8-7 8-13a8 8 0 0 0-16 0c0 6 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></symbol>
<symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 5h8a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h8"/></symbol>
<symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
<symbol id="i-warning" viewBox="0 0 24 24"><path d="m12 3 10 18H2z"/><path d="M12 9v5m0 3v.5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></symbol>
<symbol id="i-building" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 12h1m4 0h1M9 16h1m4 0h1"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></symbol>
<symbol id="i-school" viewBox="0 0 24 24"><path d="M2 9 12 4l10 5-10 5zM5 12v6c3 3 11 3 14 0v-6M22 9v7"/></symbol>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 10h16M7 21v-3m10 3v-3M8 14h1m6 0h1"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24"><path d="M3 10 5 4h14l2 6M4 10v11h16V10M9 21v-7h6v7"/><path d="M3 10c1 3 4 3 6 0 2 3 4 3 6 0 2 3 5 3 6 0"/></symbol>
<symbol id="i-door" viewBox="0 0 24 24"><path d="M5 21V3h14v18M9 21V6h7v15M13 13h.1"/></symbol>
<symbol id="i-wheel" viewBox="0 0 24 24"><circle cx="10" cy="16" r="6"/><circle cx="12" cy="3.5" r="1.5"/><path d="m12 7-1 5h5l4 7M12 9H7"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 10A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.5-3"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
</svg>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="app.js" defer></script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));</script>
</body>
</html>
